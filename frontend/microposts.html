    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        #micropost-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 50px; 
        }

        .card {
            position: relative;
            overflow: hidden;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin: 10px;
            width: 200px;
            height: 280px; 
            font-weight: 650;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-image: url('images/imagine_site.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card p {
            font-size: 0.9em; 
            margin: 0;
            line-height: 1.4em;
            flex-grow: 1; 
        }

        .card button {
            margin: 5px 0;
            flex-shrink: 0; 
        }

        .card .button-container {
            display: flex;
            justify-content: space-between;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            color: black;
            margin-bottom: 5px;
        }

        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; /* ca sa fie deasupra */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; 
            background-color: rgba(0,0,0,0.4); 
        }


        .modal-content {
            background-color: #fefefe;
            margin: 10% auto; 
            padding: 20px;
            border: 1px solid #888;
            width: 20%; 
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
        }

        .close {
            color: #aaa;
            float: left;
            font-size: 28px;
            font-weight: bold;
            width: 3%;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

    <h1 style="text-align: center;">All posts</h1>

    <div class="container">
        <form id="filter-form" class="form-inline justify-content-center my-4">
            <div class="form-group mx-sm-3 mb-2">
                <label for="from-date" class="mr-2">From:</label>
                <input type="date" class="form-control" id="from-date" placeholder="From">
            </div>
            <div class="form-group mx-sm-3 mb-2">
                <label for="to-date" class="mr-2">To:</label>
                <input type="date" class="form-control" id="to-date" placeholder="To">
            </div>
            <button type="submit" class="btn btn-primary mb-2">Filter</button>
        </form>
    </div>
    

    <div id="micropost-cards"></div>

    <div id="update-modal" class="modal">
        <div class="modal-content">
        <span class="close" onclick="closeUpdateModal()">&times;</span>
        <div class="container">
            <h1 class="text-center">Update Micropost</h1>
            <form id="update-micropost-form">
                <div id="message"></div>
                <input type="hidden" id="micropost-id" name="micropost_id">
                <input type="hidden" id="user-id" name="user_id">
                <div class="form-group">
                    <label for="date-update">Date and Time:</label>
                    <input type="datetime-local" class="form-control" id="date-update" name="date" required>
                </div>            
                <div class="form-group">
                    <label for="distance-update">Distance (in meters):</label>
                    <input type="number" class="form-control" id="distance-update" name="distance" required>
                </div>
                <div class="form-group">
                    <label for="time-update">Time (in minutes):</label>
                    <input type="number" class="form-control" id="time-update" name="time" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Update Micropost</button>
            </form>
        </div>
        </div>
    </div>

    <script>

        function getUserRole() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'http://localhost:3000/current_user_role', true); 
            var token = getCookie('token'); 
            xhr.setRequestHeader('Authorization', token);
            console.log("Apelez getUserRole()");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) { 
                if (xhr.status === 200) { 
                    var response = JSON.parse(xhr.responseText);
                    displayContentBasedOnRole(response.role);
                } else {
                    console.error('Eroare la obținerea rolului utilizatorului:', xhr.status);
                }
                }
            };
            xhr.send(); 
        }

        function displayContentBasedOnRole(role) {
            if (role == 'admin') {
                document.getElementById('users-link').style.display = 'block';

                const updateButonsUsers = document.querySelectorAll('.users-update');
                const deleteButonsUsers = document.querySelectorAll('.users-delete');

                updateButonsUsers.forEach(button => button.style.display = 'block');
                deleteButonsUsers.forEach(button => button.style.display = 'block');

                const updateButtons = document.querySelectorAll('.microposts-delete');
                const deleteButtons = document.querySelectorAll('.microposts-update');
                
                updateButtons.forEach(button => button.style.display = 'block');
                deleteButtons.forEach(button => button.style.display = 'block');

            } 
            else if (role == 'manager') {
                document.getElementById('users-link').style.display = 'block';

                // Aici practic am si butoanele de la postari si de la useri
                const updateButtons = document.querySelectorAll('.microposts-delete');
                const deleteButtons = document.querySelectorAll('.microposts-update');
                
                updateButtons.forEach(button => button.style.display = 'none');
                deleteButtons.forEach(button => button.style.display = 'none');

                const updateButonsUsers = document.querySelectorAll('.users-update');
                const deleteButonsUsers = document.querySelectorAll('.users-delete');

                updateButonsUsers.forEach(button => button.style.display = 'block');
                deleteButonsUsers.forEach(button => button.style.display = 'block');

            } 
            else {
                //  utilizator obișnuit
                document.getElementById('users-link').style.display = 'none';                                    

                const updateButtons = document.querySelectorAll('.btn-delete');
                const deleteButtons = document.querySelectorAll('.btn-update');
                
                updateButtons.forEach(button => button.style.display = 'none');
                deleteButtons.forEach(button => button.style.display = 'none');

            }
        }

        // variabile globale
        var microposts;
        var fromDate;
        var toDate;

        function getMicroposts(fromDate, toDate) {
            var xhr = new XMLHttpRequest();
            var url = "http://localhost:3000/microposts";
            if (fromDate && toDate) {
                url += `?from=${fromDate}&to=${toDate}`;
            }
            xhr.open("GET", url, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    microposts = JSON.parse(xhr.responseText);
                    displayMicroposts(microposts);
                    const updateButtons = document.querySelectorAll('.microposts-delete');
                    const deleteButtons = document.querySelectorAll('.microposts-update');
        
                    updateButtons.forEach(button => button.style.display = 'none');
                    deleteButtons.forEach(button => button.style.display = 'none');
                    getUserRole();
                }
            };
            xhr.send();
        }

        document.getElementById("filter-form").addEventListener("submit", function(event) {
            event.preventDefault();
            fromDate = document.getElementById("from-date").value;
            toDate = document.getElementById("to-date").value;

            if (fromDate && toDate && fromDate > toDate) {
                document.getElementById('message').innerHTML = `
                                <div class="alert alert-danger" role="alert">
                                    The 'From' date cannot be later than the 'To' date
                                </div>
                            `;
                return; 
            }

            getMicroposts(fromDate, toDate);
        });

        function openUpdateModal(micropostId) {

            var micropost = microposts.find(function(m) {
                return m.id == micropostId;
            });

            document.getElementById("date-update").value = micropost.date;
            document.getElementById("distance-update").value = micropost.distance;
            document.getElementById("time-update").value = micropost.time;

            // Setam campurile ascunse
            document.getElementById("micropost-id").value = micropostId;
            document.getElementById("user-id").value = micropost.user_id;

            var modal = document.getElementById("update-modal");
            modal.style.display = "block";

            // prevenim afișarea barei de scroll
            document.body.style.overflow = "hidden";
        }

        function closeUpdateModal() {
            var modal = document.getElementById("update-modal");
            modal.style.display = "none";
            
            document.getElementById('message').innerHTML = "";

            // permitem afișarea barei de scroll
            document.body.style.overflow = "auto";
        }

        function getUserInfo(userId) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "http://localhost:3000/users/" + userId + "/info", true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var userInfo = JSON.parse(xhr.responseText);
                    // Mergem prin micropostarile corespunzatoare si setam numele si adresa de email 
                    var names = document.getElementsByClassName("user-name-" + userId);
                    var emails = document.getElementsByClassName("user-email-" + userId);
                    for(var i = 0; i < names.length; i ++)
                        names[i].innerText = userInfo.username;
                    for(var i = 0; i < emails.length; i ++)
                        emails[i].innerText = userInfo.email;
                } else {
                    console.error("Error getting user info:", xhr.responseText);
                }
            };
            xhr.send();
        }

        function displayMicroposts(microposts) {
            // afisam postarile in cartonase
            var container = document.getElementById("micropost-cards");
            container.innerHTML = "";
            microposts.forEach(function(micropost) {
                var card = document.createElement("div");
                card.className = "card";
                var averageSpeed = (micropost.distance / 1000) / (micropost.time / 60); 
                var distanceInKm = (micropost.distance / 1000);
                var formattedDate = new Date(micropost.date).toLocaleString();
                card.innerHTML =  "<p>Date: " + formattedDate + "</p>" +
                                    "<p>Distance: " + distanceInKm.toFixed(2) + " km</p>" +
                                    "<p>Time: " + micropost.time + " minutes</p>" +
                                    "<p>Average Speed: " + averageSpeed.toFixed(2) + " km/h</p>" +
                                    "<p>Username: <span class='user-name-" + micropost.user_id + "'></span></p>" +
                                    "<p>Email: <span class='user-email-" + micropost.user_id + "'></span></p>" +
                                    "<p>Location: " + micropost.location +"</p>" +
                                    "<button  class='btn btn-danger btn-delete microposts-delete mt-2' data-id='" + micropost.id + " '>Delete</button>" +
                                    "<button class='btn btn-info btn-update microposts-update mt-1' data-id='" + micropost.id + "'>Update</button>";
                
                container.appendChild(card);

                card.querySelector(".btn-delete").addEventListener("click", function(event) {
                        var micropostId = event.target.getAttribute("data-id");
                        deleteMicropost(micropostId);
                });

                card.querySelector(".btn-update").addEventListener("click", function(event) {
                    var micropostId = event.target.getAttribute("data-id");
                    openUpdateModal(micropostId);
                });


                getUserInfo(micropost.user_id);
            });
            
        }


        function deleteMicropost(micropostId) {
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", "http://localhost:3000/microposts/" + micropostId, true);
            var token = getCookie('token');
            xhr.setRequestHeader('Authorization', token);
            xhr.onload = function () {
                if (xhr.status === 204) {
                    getMicroposts(fromDate, toDate);  
                } else {
                    console.error("Error deleting micropost:", xhr.responseText);
                }
            };
            xhr.send();
        }

        document.getElementById("update-micropost-form").addEventListener("submit", function(event) {
            event.preventDefault(); 

            var micropostId = document.getElementById("micropost-id").value;
            var date = document.getElementById("date-update").value;
            var distance = document.getElementById("distance-update").value;
            var time = document.getElementById("time-update").value;
            var user_id = document.getElementById("user-id").value;

            var formData = {
                date: date,
                distance: distance,
                time: time,
                user_id: user_id
            };

            updateMicropost(micropostId, formData);

        });

        function updateMicropost(micropostId, formData) {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", "http://localhost:3000/microposts/" + micropostId, true);
            var token = getCookie('token');
            xhr.setRequestHeader('Authorization', token);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onload = function () {
                if (xhr.status === 200) {
                    // Răspunsul de la server conține micropostarea actualizată
                    var updatedMicropost = JSON.parse(xhr.responseText);
                    // console.log("Micropost updated successfully:", updatedMicropost);
                    // Afișează mesajul de succes în div-ul cu id-ul "message"
                    document.getElementById('message').innerHTML = `
                        <div class="alert alert-success" role="alert">
                            Postare updatată!
                        </div>
                    `;
                    
                    setTimeout(closeUpdateModal, 1500);
                    // Reîncarcăm micropostările 
                    getMicroposts(fromDate, toDate);
                } else {
                    // A intervenit o eroare la actualizare
                    console.error("Error updating micropost:", xhr.responseText);
                    document.getElementById('message').innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            Update eșuat!
                        </div>
                    `;
                }
            };
            // Trimiterea datelor actualizate către backend
            xhr.send(JSON.stringify({ micropost: formData }));
        }

        function getCookie(name) {
            var value = "; " + document.cookie;
            var parts = value.split("; " + name + "=");
            if (parts.length == 2) return parts.pop().split(";").shift();
        }

        getMicroposts();

    </script>
    <script src="delogare.js" defer></script>
